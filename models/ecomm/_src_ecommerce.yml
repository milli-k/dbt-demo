version: 2

sources:
  - name: ecomm
    database: ecomm_source
    schema: public
    tables: 
      - name: distribution_centers
        columns:
          - name: ID
          - name: NAME
          - name: LATITUDE
          - name: LONGITUDE
      - name: events
        columns:
          - name: ID
          - name: SEQUENCE_NUMBER
          - name: SESSION_ID
          - name: CREATED_AT
          - name: IP_ADDRESS
          - name: CITY
          - name: STATE
          - name: COUNTRY
          - name: ZIP
          - name: LATITUDE
          - name: LONGITUDE
          - name: OS
          - name: BROWSER
          - name: TRAFFIC_SOURCE
          - name: USER_ID
          - name: URI
          - name: EVENT_TYPE
          - name: AD_EVENT_ID
          - name: REFERRER_CODE
      - name: inventory_items
        columns:
          - name: ID
          - name: PRODUCT_ID
          - name: CREATED_AT
          - name: SOLD_AT
          - name: COST
          - name: PRODUCT_CATEGORY
          - name: PRODUCT_NAME
          - name: PRODUCT_BRAND
          - name: PRODUCT_RETAIL_PRICE
          - name: PRODUCT_DEPARTMENT
          - name: PRODUCT_SKU
      - name: order_items
        columns:
          - name: ID
          - name: ORDER_ID
          - name: USER_ID
          - name: INVENTORY_ITEM_ID
          - name: SALE_PRICE
          - name: STATUS
          - name: CREATED_AT
          - name: RETURNED_AT
          - name: SHIPPED_AT
          - name: DELIVERED_AT
      - name: products
        columns:
          - name: ID
          - name: COST
          - name: CATEGORY
          - name: NAME
          - name: BRAND
          - name: RETAIL_PRICE
          - name: DEPARTMENT
          - name: SKU
          - name: DISTRIBUTION_CENTER_ID
      - name: users
        columns:
          - name: ID
          - name: FIRST_NAME
          - name: LAST_NAME
          - name: EMAIL
          - name: AGE
          - name: CITY
          - name: STATE
          - name: COUNTRY
          - name: ZIP
          - name: LATITUDE
          - name: LONGITUDE
          - name: GENDER
          - name: CREATED_AT
          - name: TRAFFIC_SOURCE