# Reference this view as ecomm__inventory_items
schema: ECOMM
table_name: INVENTORY_ITEMS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  product_id:
    sql: '"PRODUCT_ID"'
    format: ID

  created_at:
    sql: '"CREATED_AT"'

  sold_at:
    sql: '"SOLD_AT"'

  cost:
    sql: '"COST"'

  product_category:
    sql: '"PRODUCT_CATEGORY"'

  product_name:
    sql: '"PRODUCT_NAME"'

  product_brand:
    sql: '"PRODUCT_BRAND"'

  product_retail_price:
    sql: '"PRODUCT_RETAIL_PRICE"'

  product_department:
    sql: '"PRODUCT_DEPARTMENT"'

  product_sku:
    sql: '"PRODUCT_SKU"'

  product_distribution_center_id:
    sql: '"PRODUCT_DISTRIBUTION_CENTER_ID"'
    format: ID

  days_in_inventory:
    sql: CASE WHEN TIMESTAMPADD(DAY, 1 * TIMESTAMPDIFF(DAY,
      ${ecomm__inventory_items.created_at[date]},
      ${ecomm__inventory_items.sold_at[date]}),
      ${ecomm__inventory_items.created_at[date]}) <=
      ${ecomm__inventory_items.sold_at[date]} THEN TIMESTAMPDIFF(DAY,
      ${ecomm__inventory_items.created_at[date]},
      ${ecomm__inventory_items.sold_at[date]}) ELSE TIMESTAMPDIFF(DAY,
      ${ecomm__inventory_items.created_at[date]},
      ${ecomm__inventory_items.sold_at[date]}) - 1 END
    label: Days in Inventory

  days_in_inventory_bin:
    sql: ${ecomm__inventory_items.days_in_inventory}
    bin_boundaries: [ 2, 42, 81 ]
    bin_labels: [ Below 2, 2-42 days, 42-81 days, 81+ days ]
    label: Days in Inventory Bins

measures:
  count:
    aggregate_type: count
